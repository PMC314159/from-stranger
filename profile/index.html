<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>솔명 · PROFILE / 無記錄</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;

  color: #f1f1f1;
  background: #000;
}

button,
input,
a {
  font: inherit;
}

button {
  border: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
}

[hidden] {
  display: none !important;
}

::selection {
  color: #000;
  background: #eee;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {
  --bg: #000;
  --panel: #070707;
  --panel-soft: #0b0b0b;

  --text: #f1f1f1;
  --muted: #989898;
  --dim: #606060;

  --line: rgba(255,255,255,.09);
  --line-strong: rgba(255,255,255,.16);

  --danger: #c86666;
}


/* =========================================================
   HEADER
========================================================= */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;

  width: 100%;

  border-bottom: 1px solid var(--line);

  background: rgba(0,0,0,.88);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.header-inner {
  width: min(1280px, calc(100% - 64px));
  min-height: 68px;

  margin: 0 auto;

  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 34px;
}

.header-right {
  display: flex;
  align-items: center;

  gap: 34px;
}


/* =========================================================
   NAV
========================================================= */

.main-nav {
  display: flex;
  align-items: center;

  gap: 27px;
}

.main-nav a {
  position: relative;

  padding: 25px 0 23px;

  color: #707070;

  font-size: 10px;
  font-weight: 650;

  letter-spacing: .15em;

  transition: color .2s ease;
}

.main-nav a:hover,
.main-nav a.active {
  color: #eee;
}

.main-nav a.active::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: -1px;

  height: 1px;

  background: #e5e5e5;
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch {
  display: flex;
  align-items: center;

  padding: 3px;

  border: 1px solid var(--line-strong);
  border-radius: 999px;

  background: #030303;
}

.mode-btn {
  padding: 7px 13px;

  border-radius: 999px;

  color: #666;
  background: transparent;

  cursor: pointer;

  font-size: 10px;
  font-weight: 650;

  transition:
    color .2s ease,
    background .2s ease;
}

.mode-btn:hover {
  color: #ccc;
}

.mode-btn.active {
  color: #050505;
  background: #ededed;
}


/* =========================================================
   PAGE
========================================================= */

.page {
  width: min(1280px, calc(100% - 64px));

  margin: 0 auto;

  padding: 90px 0 150px;
}


/* =========================================================
   PROFILE HEAD
========================================================= */

.profile-head {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    minmax(260px, .48fr);

  gap: 70px;

  align-items: end;

  padding-bottom: 50px;

  border-bottom: 1px solid var(--line);
}

.page-label {
  margin-bottom: 17px;

  color: #777;

  font-size: 10px;
  font-weight: 650;

  letter-spacing: .25em;
}

.page-title {
  margin: 0;

  font-size: clamp(54px, 6vw, 88px);
  font-weight: 450;

  line-height: .92;
  letter-spacing: -.065em;
}

.profile-side {
  padding-bottom: 5px;
}

.profile-code {
  color: #555;

  font-size: 9px;
  font-weight: 600;

  letter-spacing: .22em;
}

.profile-side-name {
  margin-top: 12px;

  color: #cfcfcf;

  font-size: 13px;
  font-weight: 550;
}


/* =========================================================
   NOTE
========================================================= */

.profile-note {
  margin-top: 28px;

  max-width: 900px;

  color: #929292;

  font-size: 13px;
  line-height: 1.85;

  word-break: keep-all;
}


/* =========================================================
   LEAD QUOTE
========================================================= */

.lead-quote {
  margin-top: 42px;

  padding: 25px 32px;

  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);

  color: #b9b9b9;
  background: #050505;

  text-align: center;

  font-size: 14px;
  line-height: 1.85;

  word-break: keep-all;
}


/* =========================================================
   SECTIONS
========================================================= */

.profile-section {
  margin-top: 100px;
}

.section-head {
  display: grid;
  grid-template-columns: 105px 1fr;

  gap: 28px;

  padding-bottom: 20px;

  border-bottom: 1px solid var(--line);
}

.section-index {
  color: #555;

  font-size: 9px;

  letter-spacing: .18em;
}

.section-title {
  margin: 0;

  color: #e9e9e9;

  font-size: 13px;
  font-weight: 650;

  letter-spacing: .16em;
}

.section-body {
  margin-left: 133px;
  padding-top: 30px;
}


/* =========================================================
   TEXT
========================================================= */

.prose {
  max-width: 900px;

  color: #aaa;

  font-size: 14px;
  line-height: 1.95;

  word-break: keep-all;
}

.prose p {
  margin: 0 0 18px;
}

.prose p:last-child {
  margin-bottom: 0;
}

.prose strong,
.prose b {
  color: #ececec;

  font-weight: 650;
}

.prose-subtitle {
  margin: 42px 0 22px;

  color: #e5e5e5;

  font-size: 18px;
  font-weight: 600;

  letter-spacing: -.02em;
}


/* =========================================================
   BASIC
========================================================= */

.basic-list {
  max-width: 900px;

  margin: 0;
}

.basic-row {
  display: grid;
  grid-template-columns: 155px 1fr;

  gap: 24px;

  padding: 17px 0;

  border-bottom: 1px solid var(--line);
}

.basic-row:first-child {
  border-top: 1px solid var(--line);
}

.basic-row dt {
  margin: 0;

  color: #717171;

  font-size: 11px;
  font-weight: 650;

  letter-spacing: .06em;
}

.basic-row dd {
  margin: 0;

  color: #c8c8c8;

  font-size: 14px;
  line-height: 1.75;

  word-break: keep-all;
}


/* =========================================================
   ART
========================================================= */

.art-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 16px;

  max-width: 880px;
}

.art-grid.single {
  grid-template-columns: 1fr;

  max-width: 760px;
}

.art-card {
  position: relative;

  width: 100%;

  aspect-ratio: 4 / 5;

  overflow: hidden;

  padding: 0;

  border: 1px solid var(--line);
  border-radius: 18px;

  background: #080808;

  cursor: pointer;

  transition:
    border-color .25s ease,
    transform .25s ease;
}

.art-card.wide {
  aspect-ratio: 16 / 9;
}

.art-card.fit {
  aspect-ratio: auto;
}

.art-card:hover {
  border-color: rgba(255,255,255,.23);

  transform: translateY(-2px);
}

.art-card img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  filter:
    saturate(.93)
    brightness(.92);

  transition:
    transform .35s ease,
    filter .35s ease;
}

.art-card.fit img {
  height: auto;

  object-fit: contain;

  background: #050505;
}

.art-card:hover img {
  transform: scale(1.015);

  filter:
    saturate(1)
    brightness(1);
}

.art-credit {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 2;

  padding: 32px 14px 12px;

  color: #eee;

  font-size: 10px;
  font-weight: 600;

  text-align: left;

  background:
    linear-gradient(
      0deg,
      rgba(0,0,0,.78),
      transparent
    );
}


/* =========================================================
   QUOTE
========================================================= */

.quote {
  max-width: 900px;

  margin: 30px 0;

  padding: 22px 25px;

  border-left: 1px solid #555;

  color: #aaa;
  background: #050505;

  font-size: 13px;
  line-height: 1.9;

  word-break: keep-all;
}

.quote.center {
  border-left: 0;

  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);

  text-align: center;
}

.quote.red {
  color: #c76565;

  font-weight: 650;
}


/* =========================================================
   LONG IMAGES
========================================================= */

.long-images {
  max-width: 900px;

  margin-top: 30px;

  display: flex;
  flex-direction: column;

  gap: 34px;
}

.long-figure {
  margin: 0;
}

.long-image-button {
  width: 100%;

  display: block;

  padding: 0;

  border: 0;

  background: transparent;

  cursor: pointer;
}

.long-image-button img {
  width: 100%;
  height: auto;

  display: block;

  border: 1px solid var(--line);
}

.long-credit {
  margin-top: 8px;

  color: #666;

  font-size: 10px;

  text-align: right;
}


/* =========================================================
   SPOILER
========================================================= */

.spoiler {
  max-width: 900px;

  margin-bottom: 25px;

  color: #c76565;

  font-size: 12px;
  font-weight: 650;

  line-height: 1.8;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  margin-top: 140px;

  padding-top: 25px;

  border-top: 1px solid var(--line);

  color: #555;

  font-size: 9px;

  letter-spacing: .15em;
}


/* =========================================================
   POPUP
========================================================= */

.popup {
  position: fixed;
  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 30px;

  background: rgba(0,0,0,.91);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.popup.open {
  display: flex;
}

.popup-inner {
  position: relative;

  max-width: min(1100px, 92vw);
  max-height: 92vh;
}

.popup-image {
  display: block;

  max-width: 100%;
  max-height: 84vh;

  object-fit: contain;
}

.popup-credit {
  margin-top: 10px;

  color: #888;

  font-size: 11px;

  text-align: right;
}

.popup-close {
  position: absolute;

  top: -17px;
  right: -17px;

  width: 38px;
  height: 38px;

  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;

  color: #eee;
  background: #080808;

  cursor: pointer;

  font-size: 20px;
}


/* =========================================================
   LOCK
========================================================= */

.lock-screen {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background: #000;
}

.lock-card {
  width: min(400px, 100%);

  padding: 34px;

  border: 1px solid var(--line-strong);

  background: #050505;
}

.lock-label {
  margin-bottom: 16px;

  color: #666;

  font-size: 9px;
  font-weight: 650;

  letter-spacing: .22em;
}

.lock-card h2 {
  margin: 0;

  color: #eee;

  font-size: 27px;
  font-weight: 500;

  letter-spacing: -.035em;
}

.lock-card p {
  margin: 12px 0 24px;

  color: #777;

  font-size: 12px;
  line-height: 1.7;
}

.lock-card input {
  width: 100%;

  padding: 13px 14px;

  border: 1px solid var(--line-strong);

  outline: none;

  color: #eee;
  background: #000;
}

.lock-card input:focus {
  border-color: #555;
}

.lock-card button {
  width: 100%;

  margin-top: 10px;

  padding: 13px;

  color: #080808;
  background: #eee;

  cursor: pointer;

  font-weight: 650;
}

.lock-error {
  min-height: 18px;

  margin: 11px 0 0 !important;

  color: #b95d5d !important;

  font-size: 11px !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

  .header-inner,
  .page {
    width: min(100% - 36px, 1280px);
  }

  .header-inner {
    min-height: auto;

    padding: 16px 0;
  }

  .header-right {
    width: 100%;

    justify-content: space-between;

    gap: 20px;
  }

  .main-nav {
    gap: 16px;
  }

  .main-nav a {
    padding: 5px 0 7px;

    font-size: 9px;
  }

  .page {
    padding-top: 62px;
  }

  .profile-head {
    grid-template-columns: 1fr;

    gap: 30px;
  }

  .profile-side {
    padding: 0;
  }

  .section-head {
    grid-template-columns: 70px 1fr;

    gap: 18px;
  }

  .section-body {
    margin-left: 0;
  }

}


@media (max-width: 620px) {

  .header-right {
    align-items: flex-end;
  }

  .mode-btn {
    padding: 6px 10px;

    font-size: 9px;
  }

  .page-title {
    font-size: 52px;
  }

  .profile-section {
    margin-top: 80px;
  }

  .art-grid {
    grid-template-columns: 1fr;
  }

  .basic-row {
    grid-template-columns: 1fr;

    gap: 7px;
  }

  .lead-quote {
    padding: 22px 18px;

    font-size: 12px;
  }

  .section-head {
    display: block;
  }

  .section-index {
    margin-bottom: 10px;
  }

}


@media (max-width: 480px) {

  .header-right {
    flex-direction: column-reverse;
  }

  .mode-switch {
    align-self: flex-end;
  }

  .main-nav {
    align-self: flex-end;
  }

}


@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }

}
</style>
</head>


<body>


<!-- =======================================================
     LOCK
======================================================= -->

<div
  class="lock-screen"
  id="lockScreen"
  hidden
>

  <form
    class="lock-card"
    id="lockForm"
  >

    <div class="lock-label">
      PRIVATE PROFILE
    </div>

    <h2 id="lockTitle">
      Profile
    </h2>

    <p id="lockText">
      프로필 비밀번호를 입력해주세요.
    </p>

    <input
      id="passwordInput"
      type="password"
      autocomplete="current-password"
      aria-label="비밀번호"
    >

    <button type="submit">
      OPEN PROFILE
    </button>

    <p
      class="lock-error"
      id="lockError"
    ></p>

  </form>

</div>



<!-- =======================================================
     HEADER
======================================================= -->

<header class="site-header">

  <div class="header-inner">

    <div class="header-right">


      <nav
        class="main-nav"
        aria-label="페이지 메뉴"
      >

        <a
          id="mainLink"
          href="../main/?theme=solmyeong"
        >
          MAIN
        </a>

        <a
          class="active"
          id="profileLink"
          href="../profile/?theme=solmyeong"
        >
          PROFILE
        </a>

        <a
          id="dreamLink"
          href="../dream/?theme=solmyeong"
        >
          DREAM
        </a>

      </nav>


      <div
        class="mode-switch"
        id="modeSwitch"
      >

        <button
          type="button"
          class="mode-btn"
          data-mode="solmyeong"
        >
          솔명
        </button>

        <button
          type="button"
          class="mode-btn"
          data-mode="podohaeil"
        >
          포도해일
        </button>

      </div>

    </div>

  </div>

</header>



<!-- =======================================================
     PAGE
======================================================= -->

<main class="page">

  <div id="profileContent"></div>

  <footer class="footer">

    <span id="footerLabel">
      PROFILE / 無記錄
    </span>

  </footer>

</main>



<!-- =======================================================
     SOLMYEONG TEMPLATE
======================================================= -->

<template id="template-solmyeong">


  <header class="profile-head">

    <div>

      <div class="page-label">
        PROFILE / 無記錄
      </div>

      <h1 class="page-title">
        염해솔
      </h1>

    </div>


    <div class="profile-side">

      <div class="profile-code">
        CHARACTER FILE
      </div>

      <div class="profile-side-name">
        염해솔 · 無記錄
      </div>

    </div>

  </header>



  <div class="lead-quote">
    너만은 내 '이름'을 알고있잖니.
  </div>



  <!-- ILLUSTRATION -->

  <section class="profile-section">

    <header class="section-head">

      <div class="section-index">
        01
      </div>

      <h2 class="section-title">
        ILLUSTRATION
      </h2>

    </header>


    <div class="section-body">

      <div class="art-grid">

        <button
          type="button"
          class="art-card"
          data-src="../pictures/17.png"
          data-artist="도련님"
        >

          <img
            src="../pictures/17.png"
            alt="염해솔 프로필 일러스트"
          >

          <div class="art-credit">
            © 도련님
          </div>

        </button>


        <button
          type="button"
          class="art-card"
          data-src="../pictures/18.png"
          data-artist="응구님"
        >

          <img
            src="../pictures/18.png"
            alt="염해솔 프로필 일러스트"
          >

          <div class="art-credit">
            © 응구님
          </div>

        </button>

      </div>

    </div>

  </section>



  <!-- BASIC -->

  <section class="profile-section">

    <header class="section-head">

      <div class="section-index">
        02
      </div>

      <h2 class="section-title">
        BASIC
      </h2>

    </header>


    <div class="section-body">

      <dl class="basic-list">

        <div class="basic-row">
          <dt>이름</dt>
          <dd>염해솔(廉海率)</dd>
        </div>

        <div class="basic-row">
          <dt>연령</dt>
          <dd>30대 초반</dd>
        </div>

        <div class="basic-row">
          <dt>신장 및 체격</dt>
          <dd>158cm / 52kg</dd>
        </div>

        <div class="basic-row">
          <dt>Keyword</dt>
          <dd>
            #냉철한 #의뭉스러운 #지략가 #직설적인
            #빙의 #트립 #이방인
          </dd>
        </div>

        <div class="basic-row">
          <dt>Catchphrase</dt>
          <dd>
            #여백의_관찰자 #無記錄
          </dd>
        </div>

      </dl>

    </div>

  </section>



  <!-- INTRODUCTION -->

  <section class="profile-section">

    <header class="section-head">

      <div class="section-index">
        03
      </div>

      <h2 class="section-title">
        INTRODUCTION
      </h2>

    </header>


    <div class="section-body prose">

      <p>
        약칭 '괴담출근'에 등장하는 작중 비공식 캐릭터.
      </p>

      <p>
        김솔음과 같은 《어둠탐사기록》 밖에서 온 존재로 서술되며,
        이야기는 주인공인 솔음의 시점으로 전개되기에 상세한 내막까지는
        설명되지 않으나, 확실한 것은 그녀 또한 이 세계에 본래 있던
        존재가 아니며, 원래 있던 세계로 돌아가고자 한다는 것이다.
      </p>

      <p>
        어떤 이유인지 작중 인물들은 그녀의 이름을 보고 듣고 말할 수 있지만,
        서술로써 풀어지는 순간 그녀의 이름은 ■■ 으로 블러처리 되어
        알아볼 수 없게 되어버린다. 솔음의 서술에서는 통칭
        '무명(無名)'으로 지칭하는 편이며 이름이 들리지 않고 볼 수 없는
        이유는 차츰 '괴담출근'이 전개되며 풀어지지 않을까 하는
        추측만이 있을 뿐이다.
      </p>

      <p>
        본래라면 어제와 다를 바 없이 이어졌을 일상.
        그곳에 두고 온 운명과 삶.
      </p>

      <p>
        어느 것 하나 놓칠 수 없었던, 스스로 움켜 쥔 뒤바꾼 운명을
        다시 되찾기 위해 주인공 김솔음과 본래 세계로 돌아가기 위해
        고군분투 하는 이야기.
      </p>

  aria-hidden="true"
>

      class="popup-close"
      id="popupClose"
      type="button"

      src=""
      alt="전체 이미지"
    >

    <div
      class="popup-credit"
      id="popupCredit"
    ></div>

  </div>

</div>



<script>
(() => {

  "use strict";


  /* =======================================================
     DATA
  ======================================================= */

  const DATA = {

    solmyeong: {

      title:
        "솔명 · PROFILE / 無記錄",

      pair:
        "솔명",

      label:
        "PROFILE / 無記錄",

      template:
        "template-solmyeong",

      password:
        "nameless0414",

      key:
        "profile-solmyeong"

    },


    podohaeil: {

      title:
        "포도해일 · PROFILE / 海溢",

      pair:
        "포도해일",

      label:
        "PROFILE / 海溢",

      template:
        "template-podohaeil",

      password:
        "seawave0414",

      key:
        "profile-podohaeil"

    }

  };


  /* =======================================================
     ELEMENTS
  ======================================================= */

  const content =
    document.getElementById(
      "profileContent"
    );

  const mainLink =
    document.getElementById(
      "mainLink"
    );

  const profileLink =
    document.getElementById(
      "profileLink"
    );

  const dreamLink =
    document.getElementById(
      "dreamLink"
    );

  const modeButtons =
    [
      ...document.querySelectorAll(
        "[data-mode]"
      )
    ];

  const footerLabel =
    document.getElementById(
      "footerLabel"
    );


  const lockScreen =
    document.getElementById(
      "lockScreen"
    );

  const lockForm =
    document.getElementById(
      "lockForm"
    );

  const passwordInput =
    document.getElementById(
      "passwordInput"
    );

  const lockTitle =
    document.getElementById(
      "lockTitle"
    );

  const lockText =
    document.getElementById(
      "lockText"
    );

  const lockError =
    document.getElementById(
      "lockError"
    );


  const popup =
    document.getElementById(
      "imagePopup"
    );

  const popupImage =
    document.getElementById(
      "popupImage"
    );

  const popupCredit =
    document.getElementById(
      "popupCredit"
    );

  const popupClose =
    document.getElementById(
      "popupClose"
    );


  let currentMode =
    getInitialMode();


  /* =======================================================
     GET MODE
  ======================================================= */

  function getInitialMode() {

    const params =
      new URLSearchParams(
        location.search
      );

    const query =
      params.get("theme") ||
      params.get("mode");


    if (DATA[query]) {
      return query;
    }


    try {

      const saved =
        localStorage.getItem(
          "naru-current-mode"
        );

      if (DATA[saved]) {
        return saved;
      }

    } catch (error) {}


    return "solmyeong";
  }


  /* =======================================================
     LOCK
  ======================================================= */

  function isUnlocked(mode) {

    try {

      return (
        sessionStorage.getItem(
          DATA[mode].key
        ) === "ok"
      );

    } catch (error) {

      return false;

    }

  }


  function rememberUnlock(mode) {

    try {

      sessionStorage.setItem(
        DATA[mode].key,
        "ok"
      );

    } catch (error) {}

  }


  function showLock() {

    const data =
      DATA[currentMode];


    lockTitle.textContent =
      `${data.pair} Profile`;

    lockText.textContent =
      `${data.pair} 프로필 비밀번호를 입력해주세요.`;

    lockError.textContent =
      "";

    passwordInput.value =
      "";

    lockScreen.hidden =
      false;

    document.body.style.overflow =
      "hidden";


    setTimeout(
      () => passwordInput.focus(),
      0
    );

  }


  function hideLock() {

    lockScreen.hidden =
      true;

    document.body.style.overflow =
      "";

  }


  function updateLock() {

    if (
      isUnlocked(
        currentMode
      )
    ) {

      hideLock();

    } else {

      showLock();

    }

  }


  lockForm.addEventListener(
    "submit",
    event => {

      event.preventDefault();


      const data =
        DATA[currentMode];


      if (
        passwordInput.value ===
        data.password
      ) {

        rememberUnlock(
          currentMode
        );

        hideLock();

        return;

      }


      lockError.textContent =
        "비밀번호가 틀렸습니다.";

      passwordInput.select();

    }
  );


  /* =======================================================
     RENDER
  ======================================================= */

  function renderMode(
    mode,
    checkPassword = true
  ) {

    if (!DATA[mode]) {
      mode = "solmyeong";
    }


    currentMode =
      mode;


    const data =
      DATA[mode];


    /* tab title */

    document.title =
      data.title;


    /* template */

    const template =
      document.getElementById(
        data.template
      );

    content.innerHTML =
      template.innerHTML;


    /* footer */

    footerLabel.textContent =
      data.label;


    /* page links */

    mainLink.href =
      `../main/?theme=${mode}`;

    profileLink.href =
      `../profile/?theme=${mode}`;

    dreamLink.href =
      `../dream/?theme=${mode}`;


    /* buttons */

    modeButtons.forEach(
      button => {

        const active =
          button.dataset.mode === mode;

        button.classList.toggle(
          "active",
          active
        );

      }
    );


    /* save */

    try {

      localStorage.setItem(
        "naru-current-mode",
        mode
      );

    } catch (error) {}


    /* URL */

    const url =
      new URL(
        location.href
      );

    url.searchParams.delete(
      "mode"
    );

    url.searchParams.set(
      "theme",
      mode
    );

    history.replaceState(
      null,
      "",
      url
    );


    if (
      checkPassword
    ) {

      updateLock();

    }

  }


  /* =======================================================
     MODE SWITCH
  ======================================================= */

  modeButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const mode =
            button.dataset.mode;


          if (
            mode === currentMode
          ) {

            return;

          }


          closePopup();


          renderMode(
            mode,
            true
          );


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );

    }
  );


  /* =======================================================
     POPUP
  ======================================================= */

  function openPopup(
    src,
    artist
  ) {

    popupImage.src =
      src;

    popupCredit.textContent =
      artist
        ? `© ${artist}`
        : "";

    popup.classList.add(
      "open"
    );

    popup.setAttribute(
      "aria-hidden",
      "false"
    );

  }


  function closePopup() {

    popup.classList.remove(
      "open"
    );

    popup.setAttribute(
      "aria-hidden",
      "true"
    );

    popupImage.src =
      "";

  }


  content.addEventListener(
    "click",
    event => {

      const target =
        event.target.closest(
          "[data-src]"
        );


      if (!target) {
        return;
      }


      openPopup(
        target.dataset.src,
        target.dataset.artist || ""
      );

    }
  );


  popupClose.addEventListener(
    "click",
    closePopup
  );


  popup.addEventListener(
    "click",
    event => {

      if (
        event.target === popup
      ) {

        closePopup();

      }

    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        closePopup();

      }

    }
  );


  /* =======================================================
     START
  ======================================================= */

  renderMode(
    currentMode,
    true
  );

})();
</script>
