<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>솔명</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  overflow-x: hidden;

  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;

  color: var(--text);
  background: var(--bg);

  transition:
    background .35s ease,
    color .35s ease;
}

button,
a {
  font: inherit;
}

button {
  border: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

::selection {
  color: #fff;
  background: var(--accent);
}


/* =========================================================
   THEMES
========================================================= */

body.solmyeong {
  --bg: #080606;
  --bg-soft: #100908;

  --text: #f3eeee;
  --muted: #9c8f8c;
  --dim: #655956;

  --accent: #c85047;
  --accent-soft: rgba(200,80,71,.12);

  --line: rgba(222,112,101,.16);
  --line-soft: rgba(255,255,255,.065);
}


body.podohaeil {
  --bg: #060812;
  --bg-soft: #090d19;

  --text: #f0f3fa;
  --muted: #929bad;
  --dim: #626a7e;

  --accent: #5779e8;
  --accent-soft: rgba(87,121,232,.13);

  --line: rgba(119,149,237,.17);
  --line-soft: rgba(255,255,255,.065);
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before {
  content: "";

  position: fixed;
  inset: 0;
  z-index: -1;

  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 38%,
      var(--accent-soft),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      var(--bg-soft),
      var(--bg) 68%
    );
}


/* =========================================================
   HOME
========================================================= */

.home {
  width: 100%;
  min-height: 100svh;

  padding:
    clamp(32px, 5vh, 68px)
    32px;

  display: flex;
  align-items: center;
  justify-content: center;
}


/*
  핵심:
  왼쪽/오른쪽이 화면 끝으로 흩어지지 않고
  하나의 중앙 그룹처럼 보이도록 폭 제한.
*/

.home-inner {
  width: min(1160px, 100%);

  display: grid;

  grid-template-columns:
    minmax(330px, 390px)
    minmax(440px, 570px);

  gap: clamp(48px, 6vw, 86px);

  align-items: center;
  justify-content: center;
}


/* =========================================================
   LEFT CONTENT
========================================================= */

.home-info {
  min-width: 0;
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch {
  width: fit-content;

  display: flex;

  padding: 3px;

  border: 1px solid var(--line);
  border-radius: 999px;

  background: rgba(0,0,0,.16);
}

.mode-btn {
  min-width: 83px;

  padding: 7px 14px;

  border-radius: 999px;

  color: var(--dim);
  background: transparent;

  cursor: pointer;

  font-size: 10px;
  font-weight: 650;

  transition:
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.mode-btn:hover {
  color: var(--text);
}

.mode-btn.active {
  color: var(--text);

  background: var(--accent-soft);

  box-shadow:
    inset 0 0 0 1px var(--line);
}


/* =========================================================
   PAIR
========================================================= */

.pair-content {
  margin-top: 76px;
}

.pair-name {
  margin: 0;

  color: var(--text);

  font-size:
    clamp(56px, 5.5vw, 82px);

  font-weight: 500;

  line-height: .92;
  letter-spacing: -.065em;
}

.catchphrase {
  margin-top: 25px;

  color: var(--muted);

  font-size: 13px;
  font-weight: 500;

  line-height: 1.75;

  word-break: keep-all;
}

.accent-line {
  width: 43px;
  height: 1px;

  margin-top: 32px;

  background: var(--accent);
}


/* =========================================================
   NAV
========================================================= */

.menu {
  margin-top: 52px;

  border-top: 1px solid var(--line);
}

.menu-link {
  min-height: 57px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--line-soft);

  transition:
    padding .2s ease,
    background .2s ease;
}

.menu-title {
  color: var(--text);

  font-size: 14px;
  font-weight: 550;
}

.menu-arrow {
  color: var(--accent);

  font-size: 13px;

  opacity: 0;

  transform: translateX(-5px);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.menu-link:hover {
  padding-left: 8px;
  padding-right: 8px;

  background: rgba(255,255,255,.015);
}

.menu-link:hover .menu-arrow {
  opacity: 1;
  transform: translateX(0);
}


/* =========================================================
   VISUAL
========================================================= */

.visual-wrap {
  min-width: 0;

  display: flex;
  justify-content: center;
}


/*
  일러스트 자체가 블럭.
  바깥쪽 별도 카드 없음.
*/

.visual-block {
  position: relative;

  width: min(100%, 560px);

  aspect-ratio: 1 / 1;

  overflow: hidden;

  border: 1px solid var(--line);
  border-radius: 30px;

  background: #080808;

  box-shadow:
    0 24px 70px rgba(0,0,0,.22);

  transition:
    transform .3s ease,
    border-color .3s ease;
}

.visual-block:hover {
  transform: translateY(-3px);

  border-color: var(--accent);
}


.main-illust {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transition:
    opacity .28s ease,
    transform .45s ease;
}

.visual-block:hover .main-illust {
  transform: scale(1.012);
}

.main-illust.is-changing {
  opacity: 0;
}


/*
  이미지 위에 거의 안 보일 정도의
  얕은 톤 정리만.
*/

.visual-block::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      0deg,
      rgba(0,0,0,.09),
      transparent 27%
    );
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 950px) {

  .home {
    align-items: flex-start;

    padding-top: 38px;
    padding-bottom: 38px;
  }

  .home-inner {
    width: min(720px, 100%);

    grid-template-columns: 1fr;

    gap: 54px;
  }

  .home-info {
    width: min(520px, 100%);

    margin: 0 auto;
  }

  .pair-content {
    margin-top: 68px;
  }

  .visual-wrap {
    width: 100%;
  }

  .visual-block {
    width: min(100%, 620px);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 560px) {

  .home {
    padding:
      22px
      16px
      26px;
  }

  .home-inner {
    gap: 40px;
  }

  .mode-btn {
    min-width: 75px;

    padding: 7px 10px;

    font-size: 9px;
  }

  .pair-content {
    margin-top: 58px;
  }

  .pair-name {
    font-size: 48px;
  }

  .catchphrase {
    font-size: 12px;
  }

  .menu {
    margin-top: 42px;
  }

  .menu-link {
    min-height: 53px;
  }

  .visual-block {
    border-radius: 22px;
  }

}


@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }

}
</style>
</head>


<body class="solmyeong">


<main class="home">

  <div class="home-inner">


    <!-- =====================================================
         INFO
    ====================================================== -->

    <section class="home-info">


      <div
        class="mode-switch"
        aria-label="모드 전환"
      >

        <button
          type="button"
          class="mode-btn"
          data-mode="solmyeong"
        >
          솔명
        </button>

        <button
          type="button"
          class="mode-btn"
          data-mode="podohaeil"
        >
          포도해일
        </button>

      </div>



      <div class="pair-content">


        <h1
          class="pair-name"
          id="pairName"
        >
          솔명
        </h1>


        <div
          class="catchphrase"
          id="catchphrase"
        >
          수레바퀴 위의 에트랑제
        </div>


        <div class="accent-line"></div>



        <nav
          class="menu"
          aria-label="페이지 메뉴"
        >


          <a
            class="menu-link"
            id="mainLink"
            href="./main/?theme=solmyeong"
          >

            <span class="menu-title">
              Main
            </span>

            <span class="menu-arrow">
              ↗
            </span>

          </a>


          <a
            class="menu-link"
            id="profileLink"
            href="./profile/?theme=solmyeong"
          >

            <span class="menu-title">
              Profile
            </span>

            <span class="menu-arrow">
              ↗
            </span>

          </a>


          <a
            class="menu-link"
            id="dreamLink"
            href="./dream/?theme=solmyeong"
          >

            <span class="menu-title">
              Dream
            </span>

            <span class="menu-arrow">
              ↗
            </span>

          </a>


        </nav>


      </div>


    </section>



    <!-- =====================================================
         VISUAL
    ====================================================== -->

    <section class="visual-wrap">

      <div class="visual-block">

        <img
          id="mainIllust"
          class="main-illust"
          src="./pictures/1.jpg"
          alt=""
        >

      </div>

    </section>


  </div>

</main>



<script>
(() => {

  "use strict";


  const DATA = {

    solmyeong: {

      className:
        "solmyeong",

      title:
        "솔명",

      name:
        "솔명",

      catchphrase:
        "수레바퀴 위의 에트랑제",

      image:
        "./pictures/1.jpg",

      /*
        정사각형 블럭 안에서
        인물 위주로 보이도록 위치.
      */
      imagePosition:
        "76% center",

      main:
        "./main/?theme=solmyeong",

      profile:
        "./profile/?theme=solmyeong",

      dream:
        "./dream/?theme=solmyeong",

      password:
        "nameless0414",

      key:
        "profile-solmyeong"

    },


    podohaeil: {

      className:
        "podohaeil",

      title:
        "포도해일",

      name:
        "포도해일",

      catchphrase:
        "녹슨 용골과 빛바랜 돛의 도해渡海",

      image:
        "./pictures/2.jpg",

      imagePosition:
        "70% center",

      main:
        "./main/?theme=podohaeil",

      profile:
        "./profile/?theme=podohaeil",

      dream:
        "./dream/?theme=podohaeil",

      password:
        "seawave0414",

      key:
        "profile-podohaeil"

    }

  };


  const body =
    document.body;

  const pairName =
    document.getElementById(
      "pairName"
    );

  const catchphrase =
    document.getElementById(
      "catchphrase"
    );

  const mainIllust =
    document.getElementById(
      "mainIllust"
    );

  const mainLink =
    document.getElementById(
      "mainLink"
    );

  const profileLink =
    document.getElementById(
      "profileLink"
    );

  const dreamLink =
    document.getElementById(
      "dreamLink"
    );

  const buttons =
    [
      ...document.querySelectorAll(
        "[data-mode]"
      )
    ];


  let currentMode =
    getInitialMode();


  /* =========================================================
     GET MODE
  ========================================================= */

  function getInitialMode() {

    const params =
      new URLSearchParams(
        location.search
      );

    const query =
      params.get("mode") ||
      params.get("theme");


    if (DATA[query]) {
      return query;
    }


    try {

      const saved =
        localStorage.getItem(
          "pair-current-mode"
        );


      if (DATA[saved]) {
        return saved;
      }

    } catch (error) {}


    return "solmyeong";
  }


  /* =========================================================
     RENDER
  ========================================================= */

  function renderMode(
    mode,
    animate = true
  ) {

    if (!DATA[mode]) {
      mode = "solmyeong";
    }


    currentMode =
      mode;


    const data =
      DATA[mode];


    if (animate) {

      mainIllust.classList.add(
        "is-changing"
      );

    }


    setTimeout(
      () => {


        body.classList.remove(
          "solmyeong",
          "podohaeil"
        );


        body.classList.add(
          data.className
        );


        document.title =
          data.title;


        pairName.textContent =
          data.name;


        catchphrase.textContent =
          data.catchphrase;


        mainIllust.src =
          data.image;


        mainIllust.style.objectPosition =
          data.imagePosition;


        mainLink.href =
          data.main;


        profileLink.href =
          data.profile;


        dreamLink.href =
          data.dream;


        buttons.forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.mode === mode
            );

          }
        );


        mainIllust.classList.remove(
          "is-changing"
        );


      },
      animate ? 130 : 0
    );


    try {

      localStorage.setItem(
        "pair-current-mode",
        mode
      );

    } catch (error) {}


    const url =
      new URL(
        location.href
      );


    url.searchParams.delete(
      "theme"
    );


    url.searchParams.set(
      "mode",
      mode
    );


    history.replaceState(
      null,
      "",
      url
    );

  }


  /* =========================================================
     SWITCH
  ========================================================= */

  buttons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          renderMode(
            button.dataset.mode
          );

        }
      );

    }
  );


  /* =========================================================
     PROFILE PASSWORD
  ========================================================= */

  profileLink.addEventListener(
    "click",
    event => {

      event.preventDefault();


      const data =
        DATA[currentMode];


      try {

        if (
          sessionStorage.getItem(
            data.key
          ) === "ok"
        ) {

          location.href =
            data.profile;

          return;

        }

      } catch (error) {}


      const input =
        prompt(
          `${data.name} Profile 비밀번호를 입력하세요.`
        );


      if (
        input === null
      ) {
        return;
      }


      if (
        input === data.password
      ) {

        try {

          sessionStorage.setItem(
            data.key,
            "ok"
          );

        } catch (error) {}


        location.href =
          data.profile;

        return;

      }


      alert(
        "비밀번호가 틀렸습니다."
      );

    }
  );


  /* =========================================================
     START
  ========================================================= */

  renderMode(
    currentMode,
    false
  );

})();
</script>

</body>
</html>
