<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>솔명</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  overflow-x: hidden;

  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;

  color: var(--text);
  background: var(--bg);

  transition:
    background .35s ease,
    color .35s ease;
}

button,
a {
  font: inherit;
}

button {
  border: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
}

::selection {
  color: #fff;
  background: var(--accent);
}


/* =========================================================
   THEME
========================================================= */

body.solmyeong {
  --bg: #090606;
  --bg-soft: #110908;

  --text: #f4efee;
  --muted: #9f908d;
  --dim: #695c59;

  --accent: #c85047;
  --accent-light: #df685f;
  --accent-rgb: 200,80,71;

  --line: rgba(222,112,101,.17);
  --line-soft: rgba(255,255,255,.065);

  --art-bg: #77170f;
  --art-panel: #28100d;
}


body.podohaeil {
  --bg: #060812;
  --bg-soft: #090d19;

  --text: #f0f3fa;
  --muted: #949caf;
  --dim: #626a7e;

  --accent: #5779e8;
  --accent-light: #7590ef;
  --accent-rgb: 87,121,232;

  --line: rgba(119,149,237,.18);
  --line-soft: rgba(255,255,255,.065);

  --art-bg: #302bec;
  --art-panel: #111730;
}


/* =========================================================
   PAGE
========================================================= */

.page {
  min-height: 100svh;

  display: grid;

  grid-template-columns:
    minmax(430px, 45%)
    minmax(0, 55%);

  overflow: hidden;
}


/* =========================================================
   LEFT
========================================================= */

.left {
  position: relative;
  z-index: 3;

  min-height: 100svh;

  padding:
    clamp(34px, 4vw, 58px)
    clamp(48px, 5.5vw, 96px)
    clamp(42px, 5vw, 68px);

  display: flex;
  flex-direction: column;

  background:
    radial-gradient(
      circle at 8% 7%,
      rgba(var(--accent-rgb), .10),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      var(--bg-soft),
      var(--bg) 72%
    );
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch {
  align-self: flex-start;

  display: flex;
  align-items: center;

  padding: 3px;

  border: 1px solid var(--line);
  border-radius: 999px;

  background: rgba(0,0,0,.18);
}

.mode-btn {
  min-width: 88px;

  padding: 8px 15px;

  border-radius: 999px;

  color: var(--dim);
  background: transparent;

  cursor: pointer;

  font-size: 11px;
  font-weight: 650;

  transition:
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.mode-btn:hover {
  color: var(--text);
}

.mode-btn.active {
  color: var(--text);

  background:
    rgba(var(--accent-rgb), .12);

  box-shadow:
    inset 0 0 0 1px
    rgba(var(--accent-rgb), .30);
}


/* =========================================================
   LEFT CONTENT
========================================================= */

.content {
  width: min(100%, 470px);

  margin-top: auto;
  margin-bottom: auto;

  padding: 90px 0;
}

.pair-name {
  margin: 0;

  font-size:
    clamp(50px, 5vw, 76px);

  font-weight: 520;

  line-height: .95;

  letter-spacing: -.065em;
}

.catchphrase {
  margin-top: 24px;

  color: var(--muted);

  font-size: 14px;
  font-weight: 500;

  line-height: 1.75;

  word-break: keep-all;
}

.accent-line {
  width: 46px;
  height: 1px;

  margin-top: 34px;

  background: var(--accent);
}


/* =========================================================
   MENU
========================================================= */

.menu {
  margin-top: 56px;

  border-top: 1px solid var(--line);
}

.menu-link {
  display: grid;

  grid-template-columns:
    38px
    1fr
    auto;

  align-items: center;

  gap: 12px;

  min-height: 60px;

  border-bottom: 1px solid var(--line-soft);

  transition:
    padding .2s ease,
    background .2s ease;
}

.menu-index {
  color: var(--dim);

  font-size: 9px;

  letter-spacing: .1em;
}

.menu-title {
  color: var(--text);

  font-size: 15px;
  font-weight: 520;
}

.menu-arrow {
  color: var(--accent);

  font-size: 14px;

  opacity: 0;

  transform: translateX(-5px);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.menu-link:hover {
  padding-left: 9px;
  padding-right: 9px;

  background:
    rgba(var(--accent-rgb), .025);
}

.menu-link:hover .menu-title {
  color: var(--accent-light);
}

.menu-link:hover .menu-arrow {
  opacity: 1;

  transform: translateX(0);
}


/* =========================================================
   RIGHT
========================================================= */

.right {
  position: relative;

  min-width: 0;
  min-height: 100svh;

  padding:
    clamp(28px, 3.2vw, 54px)
    clamp(28px, 3.6vw, 64px)
    clamp(28px, 3.2vw, 54px)
    clamp(18px, 2vw, 34px);

  display: flex;
  align-items: center;
  justify-content: flex-end;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 72% 50%,
      rgba(var(--accent-rgb), .10),
      transparent 48%
    ),
    var(--bg);
}


/* subtle separator */

.right::before {
  content: "";

  position: absolute;

  left: 0;
  top: 8%;
  bottom: 8%;

  width: 1px;

  background:
    linear-gradient(
      180deg,
      transparent,
      var(--line),
      transparent
    );
}


/* =========================================================
   ART CARD
========================================================= */

.art-card {
  position: relative;

  width: min(100%, 760px);
  height: calc(100svh - clamp(56px, 7vw, 108px));

  max-height: 900px;
  min-height: 560px;

  overflow: hidden;

  border: 1px solid var(--line);
  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    ),
    var(--art-panel);

  box-shadow:
    0 30px 80px rgba(0,0,0,.22);

  transition:
    border-color .3s ease,
    transform .3s ease,
    background .35s ease;
}

.art-card:hover {
  border-color:
    rgba(var(--accent-rgb), .30);

  transform: translateY(-2px);
}


/* =========================================================
   IMAGE AREA
========================================================= */

.art-image-wrap {
  position: absolute;

  inset: 18px;

  overflow: hidden;

  border-radius: 22px;

  background:
    var(--art-bg);

  transition:
    background .35s ease;
}


/*
  원본 일러스트를 통째로 보여줌.
  잘라내지 않음.
*/

.main-illust {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  object-fit: contain;

  /*
    캐릭터를 살짝 오른쪽 아래로.
  */
  object-position: right bottom;

  transition:
    opacity .28s ease,
    transform .4s ease;
}

.main-illust.is-changing {
  opacity: 0;

  transform:
    translateX(10px)
    scale(.99);
}


/* =========================================================
   VERY SUBTLE CARD GRADIENT
========================================================= */

.art-image-wrap::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.10),
      transparent 24%
    ),
    linear-gradient(
      0deg,
      rgba(0,0,0,.08),
      transparent 24%
    );
}


/* =========================================================
   SMALL DECORATION
========================================================= */

.card-corner {
  position: absolute;

  z-index: 3;

  right: 34px;
  bottom: 31px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--accent);

  opacity: .72;
}


/* =========================================================
   MOBILE / TABLET
========================================================= */

@media (max-width: 900px) {

  .page {
    display: block;
    overflow: visible;
  }

  .left {
    min-height: auto;

    padding:
      28px
      25px
      42px;
  }

  .content {
    width: min(100%, 470px);

    margin: 95px 0 0;

    padding: 0;
  }

  .right {
    min-height: auto;

    padding:
      0
      20px
      28px;

    display: block;
  }

  .right::before {
    display: none;
  }

  .art-card {
    width: 100%;
    height: min(78vh, 760px);

    min-height: 520px;

    margin: 0 auto;
  }

  .pair-name {
    font-size: 52px;
  }

}


@media (max-width: 560px) {

  .left {
    padding:
      22px
      18px
      34px;
  }

  .mode-btn {
    min-width: 76px;

    padding: 7px 11px;

    font-size: 10px;
  }

  .content {
    margin-top: 75px;
  }

  .pair-name {
    font-size: 44px;
  }

  .catchphrase {
    font-size: 12px;
  }

  .right {
    padding:
      0
      12px
      18px;
  }

  .art-card {
    min-height: 430px;
    height: 68vh;

    border-radius: 22px;
  }

  .art-image-wrap {
    inset: 11px;

    border-radius: 16px;
  }

}


@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }

}
</style>
</head>


<body class="solmyeong">

<main class="page">


  <!-- =====================================================
       LEFT
  ====================================================== -->

  <section class="left">


    <div
      class="mode-switch"
      aria-label="모드 전환"
    >

      <button
        type="button"
        class="mode-btn"
        data-mode="solmyeong"
      >
        솔명
      </button>

      <button
        type="button"
        class="mode-btn"
        data-mode="podohaeil"
      >
        포도해일
      </button>

    </div>



    <div class="content">

      <h1
        class="pair-name"
        id="pairName"
      >
        솔명
      </h1>


      <div
        class="catchphrase"
        id="catchphrase"
      >
        수레바퀴 위의 에트랑제
      </div>


      <div class="accent-line"></div>



      <nav
        class="menu"
        aria-label="페이지 메뉴"
      >

        <a
          class="menu-link"
          id="mainLink"
          href="./main/?theme=solmyeong"
        >

          <span class="menu-index">
            01
          </span>

          <span class="menu-title">
            Main
          </span>

          <span class="menu-arrow">
            ↗
          </span>

        </a>


        <a
          class="menu-link"
          id="profileLink"
          href="./profile/?theme=solmyeong"
        >

          <span class="menu-index">
            02
          </span>

          <span class="menu-title">
            Profile
          </span>

          <span class="menu-arrow">
            ↗
          </span>

        </a>


        <a
          class="menu-link"
          id="dreamLink"
          href="./dream/?theme=solmyeong"
        >

          <span class="menu-index">
            03
          </span>

          <span class="menu-title">
            Dream
          </span>

          <span class="menu-arrow">
            ↗
          </span>

        </a>

      </nav>

    </div>

  </section>



  <!-- =====================================================
       RIGHT
  ====================================================== -->

  <section class="right">

    <div class="art-card">

      <div class="art-image-wrap">

        <img
          id="mainIllust"
          class="main-illust"
          src="./pictures/1.jpg"
          alt=""
        >

      </div>

      <div class="card-corner"></div>

    </div>

  </section>


</main>



<script>
(() => {

  "use strict";


  /* =========================================================
     DATA
  ========================================================= */

  const DATA = {

    solmyeong: {

      className:
        "solmyeong",

      title:
        "솔명",

      name:
        "솔명",

      catchphrase:
        "수레바퀴 위의 에트랑제",

      image:
        "./pictures/1.jpg",

      main:
        "./main/?theme=solmyeong",

      profile:
        "./profile/?theme=solmyeong",

      dream:
        "./dream/?theme=solmyeong",

      password:
        "nameless0414",

      key:
        "profile-solmyeong"

    },


    podohaeil: {

      className:
        "podohaeil",

      title:
        "포도해일",

      name:
        "포도해일",

      catchphrase:
        "녹슨 용골과 빛바랜 돛의 도해渡海",

      image:
        "./pictures/2.jpg",

      main:
        "./main/?theme=podohaeil",

      profile:
        "./profile/?theme=podohaeil",

      dream:
        "./dream/?theme=podohaeil",

      password:
        "seawave0414",

      key:
        "profile-podohaeil"

    }

  };


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const body =
    document.body;

  const pairName =
    document.getElementById(
      "pairName"
    );

  const catchphrase =
    document.getElementById(
      "catchphrase"
    );

  const mainIllust =
    document.getElementById(
      "mainIllust"
    );

  const mainLink =
    document.getElementById(
      "mainLink"
    );

  const profileLink =
    document.getElementById(
      "profileLink"
    );

  const dreamLink =
    document.getElementById(
      "dreamLink"
    );

  const buttons =
    [
      ...document.querySelectorAll(
        "[data-mode]"
      )
    ];


  let currentMode =
    getInitialMode();


  /* =========================================================
     INITIAL MODE
  ========================================================= */

  function getInitialMode() {

    const params =
      new URLSearchParams(
        location.search
      );

    const query =
      params.get("mode") ||
      params.get("theme");


    if (DATA[query]) {
      return query;
    }


    try {

      const saved =
        localStorage.getItem(
          "naru-current-mode"
        );

      if (DATA[saved]) {
        return saved;
      }

    } catch (error) {}


    return "solmyeong";
  }


  /* =========================================================
     RENDER
  ========================================================= */

  function renderMode(
    mode,
    animate = true
  ) {

    if (!DATA[mode]) {
      mode = "solmyeong";
    }


    currentMode =
      mode;


    const data =
      DATA[mode];


    if (animate) {

      mainIllust.classList.add(
        "is-changing"
      );

    }


    setTimeout(
      () => {

        body.classList.remove(
          "solmyeong",
          "podohaeil"
        );

        body.classList.add(
          data.className
        );


        document.title =
          data.title;


        pairName.textContent =
          data.name;


        catchphrase.textContent =
          data.catchphrase;


        mainIllust.src =
          data.image;


        mainLink.href =
          data.main;


        profileLink.href =
          data.profile;


        dreamLink.href =
          data.dream;


        buttons.forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.mode === mode
            );

          }
        );


        mainIllust.classList.remove(
          "is-changing"
        );

      },
      animate ? 130 : 0
    );


    try {

      localStorage.setItem(
        "naru-current-mode",
        mode
      );

    } catch (error) {}


    const url =
      new URL(
        location.href
      );

    url.searchParams.delete(
      "theme"
    );

    url.searchParams.set(
      "mode",
      mode
    );

    history.replaceState(
      null,
      "",
      url
    );

  }


  /* =========================================================
     MODE SWITCH
  ========================================================= */

  buttons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          renderMode(
            button.dataset.mode
          );

        }
      );

    }
  );


  /* =========================================================
     PROFILE PASSWORD
  ========================================================= */

  profileLink.addEventListener(
    "click",
    event => {

      event.preventDefault();


      const data =
        DATA[currentMode];


      try {

        if (
          sessionStorage.getItem(
            data.key
          ) === "ok"
        ) {

          location.href =
            data.profile;

          return;

        }

      } catch (error) {}


      const input =
        prompt(
          `${data.name} Profile 비밀번호를 입력하세요.`
        );


      if (input === null) {
        return;
      }


      if (input === data.password) {

        try {

          sessionStorage.setItem(
            data.key,
            "ok"
          );

        } catch (error) {}


        location.href =
          data.profile;

        return;

      }


      alert(
        "비밀번호가 틀렸습니다."
      );

    }
  );


  /* =========================================================
     START
  ========================================================= */

  renderMode(
    currentMode,
    false
  );

})();
</script>

</body>
</html>
