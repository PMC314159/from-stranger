<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>솔명</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  overflow-x: hidden;

  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    sans-serif;

  color: var(--text);
  background: var(--bg);

  transition:
    background .35s ease,
    color .35s ease;
}

button,
a {
  font: inherit;
}

button {
  border: 0;
}

a {
  color: inherit;
  text-decoration: none;
}


/* =========================================================
   THEMES
========================================================= */

body.solmyeong {
  --bg: #090606;
  --bg-soft: #110908;

  --text: #f3eeee;
  --muted: #9d8e8b;
  --dim: #695c59;

  --accent: #c85047;
  --accent-light: #df685f;
  --accent-rgb: 200,80,71;

  --line: rgba(222,112,101,.17);
  --line-soft: rgba(255,255,255,.065);

  --art-bg: #73140d;
}

body.podohaeil {
  --bg: #060812;
  --bg-soft: #090d19;

  --text: #f0f3fa;
  --muted: #939caf;
  --dim: #626a7e;

  --accent: #5779e8;
  --accent-light: #7590ef;
  --accent-rgb: 87,121,232;

  --line: rgba(119,149,237,.18);
  --line-soft: rgba(255,255,255,.065);

  --art-bg: #2a28e3;
}

::selection {
  color: #fff;
  background: var(--accent);
}


/* =========================================================
   PAGE
========================================================= */

.page {
  width: 100%;
  min-height: 100svh;

  display: grid;

  grid-template-columns:
    minmax(430px, 46%)
    minmax(0, 54%);
}


/* =========================================================
   LEFT
========================================================= */

.left {
  min-height: 100svh;

  padding:
    clamp(34px, 4vw, 58px)
    clamp(48px, 5.5vw, 96px)
    clamp(42px, 5vw, 70px);

  display: flex;
  flex-direction: column;

  border-right: 1px solid var(--line);

  background:
    radial-gradient(
      circle at 7% 8%,
      rgba(var(--accent-rgb), .11),
      transparent 27%
    ),
    linear-gradient(
      145deg,
      var(--bg-soft),
      var(--bg) 72%
    );
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch {
  align-self: flex-start;

  display: flex;
  align-items: center;

  padding: 3px;

  border: 1px solid var(--line);
  border-radius: 999px;

  background: rgba(0,0,0,.18);
}

.mode-btn {
  min-width: 88px;

  padding: 8px 15px;

  border-radius: 999px;

  color: var(--dim);
  background: transparent;

  cursor: pointer;

  font-size: 11px;
  font-weight: 650;

  transition:
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.mode-btn:hover {
  color: var(--text);
}

.mode-btn.active {
  color: var(--text);

  background:
    rgba(var(--accent-rgb), .12);

  box-shadow:
    inset 0 0 0 1px
    rgba(var(--accent-rgb), .28);
}


/* =========================================================
   CONTENT
========================================================= */

.content {
  width: min(100%, 470px);

  margin-top: auto;
  margin-bottom: auto;

  padding: 90px 0;
}

.pair-name {
  margin: 0;

  font-size:
    clamp(50px, 5vw, 78px);

  font-weight: 520;

  line-height: .94;

  letter-spacing: -.065em;
}

.catchphrase {
  margin-top: 24px;

  color: var(--muted);

  font-size: 14px;
  font-weight: 500;

  line-height: 1.75;

  word-break: keep-all;
}

.accent-line {
  width: 46px;
  height: 1px;

  margin-top: 34px;

  background: var(--accent);
}


/* =========================================================
   MENU
========================================================= */

.menu {
  margin-top: 56px;

  border-top: 1px solid var(--line);
}

.menu-link {
  display: grid;

  grid-template-columns:
    38px
    1fr
    auto;

  align-items: center;

  gap: 12px;

  min-height: 60px;

  border-bottom: 1px solid var(--line-soft);

  transition:
    padding .2s ease,
    background .2s ease;
}

.menu-index {
  color: var(--dim);

  font-size: 9px;

  letter-spacing: .1em;
}

.menu-title {
  color: var(--text);

  font-size: 15px;
  font-weight: 520;
}

.menu-arrow {
  color: var(--accent);

  font-size: 14px;

  opacity: 0;

  transform: translateX(-5px);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.menu-link:hover {
  padding-left: 9px;
  padding-right: 9px;

  background:
    rgba(var(--accent-rgb), .025);
}

.menu-link:hover .menu-title {
  color: var(--accent-light);
}

.menu-link:hover .menu-arrow {
  opacity: 1;

  transform: translateX(0);
}


/* =========================================================
   RIGHT
========================================================= */

.right {
  position: relative;

  min-width: 0;
  min-height: 100svh;

  overflow: hidden;

  background: var(--art-bg);

  transition: background .35s ease;
}

.art-stage {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: var(--art-bg);
}


/*
   핵심:
   cover가 아니라 contain.
   캐릭터 머리/몸이 화면 밖으로 잘리지 않음.
*/

.main-illust {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: contain;
  object-position: center bottom;

  transition:
    opacity .28s ease,
    transform .4s ease;
}

.main-illust.is-changing {
  opacity: 0;

  transform: scale(.985);
}


/* 아주 얕은 경계만 */

.art-stage::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.10),
      transparent 18%
    );
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

  .page {
    display: block;
  }

  .right {
    position: fixed;
    inset: 0;

    z-index: -2;

    border: 0;
  }

  .art-stage {
    justify-content: flex-end;
  }

  .main-illust {
    object-fit: cover;
    object-position: 62% center;

    opacity: .52;
  }

  .left {
    position: relative;

    z-index: 2;

    min-height: 100svh;

    padding:
      28px
      25px
      34px;

    border: 0;

    background:
      linear-gradient(
        90deg,
        var(--bg) 0%,
        rgba(5,5,8,.88) 50%,
        rgba(5,5,8,.25) 100%
      ),
      linear-gradient(
        0deg,
        var(--bg) 0%,
        transparent 58%
      );
  }

  .content {
    width: min(82%, 420px);

    padding: 100px 0 70px;
  }

  .pair-name {
    font-size: 50px;
  }

  .catchphrase {
    font-size: 12px;
  }

  .menu {
    margin-top: 45px;
  }

}


@media (max-width: 480px) {

  .mode-btn {
    min-width: 76px;

    padding: 7px 11px;

    font-size: 10px;
  }

  .content {
    width: 90%;
  }

  .pair-name {
    font-size: 44px;
  }

}


@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }

}
</style>
</head>


<body class="solmyeong">

<main class="page">


  <!-- LEFT -->

  <section class="left">


    <div
      class="mode-switch"
      aria-label="모드 전환"
    >

      <button
        type="button"
        class="mode-btn"
        data-mode="solmyeong"
      >
        솔명
      </button>

      <button
        type="button"
        class="mode-btn"
        data-mode="podohaeil"
      >
        포도해일
      </button>

    </div>



    <div class="content">

      <h1
        class="pair-name"
        id="pairName"
      >
        솔명
      </h1>


      <div
        class="catchphrase"
        id="catchphrase"
      >
        수레바퀴 위의 에트랑제
      </div>


      <div class="accent-line"></div>



      <nav
        class="menu"
        aria-label="페이지 메뉴"
      >

        <a
          class="menu-link"
          id="mainLink"
          href="./main/?theme=solmyeong"
        >

          <span class="menu-index">
            01
          </span>

          <span class="menu-title">
            Main
          </span>

          <span class="menu-arrow">
            ↗
          </span>

        </a>


        <a
          class="menu-link"
          id="profileLink"
          href="./profile/?theme=solmyeong"
        >

          <span class="menu-index">
            02
          </span>

          <span class="menu-title">
            Profile
          </span>

          <span class="menu-arrow">
            ↗
          </span>

        </a>


        <a
          class="menu-link"
          id="dreamLink"
          href="./dream/?theme=solmyeong"
        >

          <span class="menu-index">
            03
          </span>

          <span class="menu-title">
            Dream
          </span>

          <span class="menu-arrow">
            ↗
          </span>

        </a>

      </nav>

    </div>

  </section>



  <!-- RIGHT -->

  <section class="right">

    <div class="art-stage">

      <img
        id="mainIllust"
        class="main-illust"
        src="./pictures/1.jpg"
        alt=""
      >

    </div>

  </section>


</main>



<script>
(() => {

  "use strict";


  const DATA = {

    solmyeong: {

      className:
        "solmyeong",

      title:
        "솔명",

      name:
        "솔명",

      catchphrase:
        "수레바퀴 위의 에트랑제",

      image:
        "./pictures/1.jpg",

      main:
        "./main/?theme=solmyeong",

      profile:
        "./profile/?theme=solmyeong",

      dream:
        "./dream/?theme=solmyeong",

      password:
        "nameless0414",

      key:
        "profile-solmyeong"

    },


    podohaeil: {

      className:
        "podohaeil",

      title:
        "포도해일",

      name:
        "포도해일",

      catchphrase:
        "녹슨 용골과 빛바랜 돛의 도해渡海",

      image:
        "./pictures/2.jpg",

      main:
        "./main/?theme=podohaeil",

      profile:
        "./profile/?theme=podohaeil",

      dream:
        "./dream/?theme=podohaeil",

      password:
        "seawave0414",

      key:
        "profile-podohaeil"

    }

  };


  const body =
    document.body;

  const pairName =
    document.getElementById(
      "pairName"
    );

  const catchphrase =
    document.getElementById(
      "catchphrase"
    );

  const mainIllust =
    document.getElementById(
      "mainIllust"
    );

  const mainLink =
    document.getElementById(
      "mainLink"
    );

  const profileLink =
    document.getElementById(
      "profileLink"
    );

  const dreamLink =
    document.getElementById(
      "dreamLink"
    );

  const buttons =
    [
      ...document.querySelectorAll(
        "[data-mode]"
      )
    ];


  let currentMode =
    getInitialMode();


  function getInitialMode() {

    const params =
      new URLSearchParams(
        location.search
      );

    const query =
      params.get("mode") ||
      params.get("theme");


    if (
      DATA[query]
    ) {
      return query;
    }


    try {

      const saved =
        localStorage.getItem(
          "naru-current-mode"
        );

      if (
        DATA[saved]
      ) {
        return saved;
      }

    } catch (error) {}


    return "solmyeong";
  }


  function renderMode(
    mode,
    animate = true
  ) {

    if (
      !DATA[mode]
    ) {
      mode = "solmyeong";
    }


    currentMode =
      mode;


    const data =
      DATA[mode];


    if (
      animate
    ) {

      mainIllust.classList.add(
        "is-changing"
      );

    }


    setTimeout(
      () => {

        body.classList.remove(
          "solmyeong",
          "podohaeil"
        );

        body.classList.add(
          data.className
        );


        document.title =
          data.title;


        pairName.textContent =
          data.name;

        catchphrase.textContent =
          data.catchphrase;


        mainIllust.src =
          data.image;


        mainLink.href =
          data.main;

        profileLink.href =
          data.profile;

        dreamLink.href =
          data.dream;


        buttons.forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.mode === mode
            );

          }
        );


        mainIllust.classList.remove(
          "is-changing"
        );

      },
      animate ? 130 : 0
    );


    try {

      localStorage.setItem(
        "naru-current-mode",
        mode
      );

    } catch (error) {}


    const url =
      new URL(
        location.href
      );

    url.searchParams.delete(
      "theme"
    );

    url.searchParams.set(
      "mode",
      mode
    );

    history.replaceState(
      null,
      "",
      url
    );

  }


  buttons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          renderMode(
            button.dataset.mode
          );

        }
      );

    }
  );


  /* PROFILE PASSWORD */

  profileLink.addEventListener(
    "click",
    event => {

      event.preventDefault();


      const data =
        DATA[currentMode];


      try {

        if (
          sessionStorage.getItem(
            data.key
          ) === "ok"
        ) {

          location.href =
            data.profile;

          return;

        }

      } catch (error) {}


      const input =
        prompt(
          `${data.name} Profile 비밀번호를 입력하세요.`
        );


      if (
        input === null
      ) {
        return;
      }


      if (
        input ===
        data.password
      ) {

        try {

          sessionStorage.setItem(
            data.key,
            "ok"
          );

        } catch (error) {}


        location.href =
          data.profile;

        return;

      }


      alert(
        "비밀번호가 틀렸습니다."
      );

    }
  );


  renderMode(
    currentMode,
    false
  );

})();
</script>

</body>
</html>
